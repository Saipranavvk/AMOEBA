name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Fast tier: check-generated + Verilator compile only (no Spike needed) ───
  ci-fast:
    name: Check Generated + Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip gcc g++ make \
            flex bison libfl-dev help2man
          pip3 install --quiet pyyaml

      - name: Cache Verilator v5.026
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-5.026-${{ runner.os }}

      - name: Build Verilator v5.026 from source
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/verilator/verilator --branch v5.026 --depth=1 /tmp/verilator-src
          cd /tmp/verilator-src && autoconf
          ./configure --prefix=/opt/verilator
          make -j$(nproc)
          make install

      - name: Add Verilator to PATH
        run: echo "/opt/verilator/bin" >> $GITHUB_PATH

      - name: Check generated files are up to date
        run: make -C sim check-generated

      - name: Compile (Verilator)
        run: make -C sim verilator/build/Vtop_tb

  # ── Baremetal regression: needs RISC-V toolchain + Spike executable ─────────
  ci-baremetal:
    name: Baremetal Regression
    runs-on: ubuntu-latest
    needs: ci-fast
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip gcc g++ make \
            flex bison libfl-dev help2man \
            gcc-riscv64-unknown-elf device-tree-compiler libboost-regex-dev libboost-system-dev
          pip3 install --quiet pyyaml

      - name: Cache Verilator v5.026
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-5.026-${{ runner.os }}

      - name: Build Verilator v5.026 from source
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/verilator/verilator --branch v5.026 --depth=1 /tmp/verilator-src
          cd /tmp/verilator-src && autoconf
          ./configure --prefix=/opt/verilator
          make -j$(nproc)
          make install

      - name: Add Verilator to PATH
        run: echo "/opt/verilator/bin" >> $GITHUB_PATH

      - name: Cache Spike
        id: cache-spike
        uses: actions/cache@v4
        with:
          path: /tmp/spike-install
          key: spike-commitlog-${{ runner.os }}-v1

      - name: Build Spike from source
        if: steps.cache-spike.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/riscv-software-src/riscv-isa-sim.git /tmp/spike-src
          mkdir /tmp/spike-src/build
          cd /tmp/spike-src/build
          ../configure --enable-commitlog --prefix=/tmp/spike-install
          make -j$(nproc)
          make install

      - name: Add Spike to PATH
        run: echo "/tmp/spike-install/bin" >> $GITHUB_PATH

      - name: Run baremetal regression
        run: make -C sim regression

  # ── FreeRTOS: needs RISC-V toolchain + FreeRTOS-Kernel; no Spike needed ─────
  ci-freertos:
    name: FreeRTOS Sorting Algo Test
    runs-on: ubuntu-latest
    needs: ci-fast
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip gcc g++ make \
            flex bison libfl-dev help2man \
            gcc-riscv64-unknown-elf
          pip3 install --quiet pyyaml

      - name: Cache Verilator v5.026
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-5.026-${{ runner.os }}

      - name: Build Verilator v5.026 from source
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/verilator/verilator --branch v5.026 --depth=1 /tmp/verilator-src
          cd /tmp/verilator-src && autoconf
          ./configure --prefix=/opt/verilator
          make -j$(nproc)
          make install

      - name: Add Verilator to PATH
        run: echo "/opt/verilator/bin" >> $GITHUB_PATH

      - name: Clone FreeRTOS-Kernel
        run: git clone --depth=1 https://github.com/FreeRTOS/FreeRTOS-Kernel.git ~/FreeRTOS-Kernel

      - name: Build and run FreeRTOS test
        run: make -C testcode/freertos
