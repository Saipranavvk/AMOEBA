# Builds the Keystone boot image and publishes it as an artifact.
#
# Separate from the boot job for the same reason as linux-image.yml: building a
# kernel would come straight out of the simulation budget.  Separate from
# linux-image.yml because the two images share almost nothing -- this one pins
# OpenSBI 1.1 rather than 1.4, adds the Keystone security monitor as an
# out-of-tree OpenSBI platform, and builds a kernel with the enclave driver
# compiled in.
name: Keystone Boot Image

on:
  workflow_dispatch:
  push:
    paths:
      - 'testcode/keystone/**'
      # The DTS and the base kernel config live under testcode/linux and are
      # shared rather than copied, so a change to either changes this image.
      - 'testcode/linux/dts/**'
      - 'testcode/linux/configs/**'
      - 'patches/keystone-sm-amoeba-platform.patch'
      - 'bin/linux_image_to_lst.py'
      - '.github/workflows/keystone-image.yml'

jobs:
  build-image:
    name: Build boot.lst (Linux 6.6 + OpenSBI 1.1 + Keystone SM)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 gcc g++ make curl xz-utils patch \
            bc bison flex libssl-dev libelf-dev device-tree-compiler cpio

      # Every source, checksum and the cross toolchain are pinned inside
      # testcode/keystone/Makefile, so the key only has to track that file.
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: testcode/keystone/build/dl
          key: keystone-dl-${{ hashFiles('testcode/keystone/Makefile') }}

      # The Makefile asserts that the SM is linked into the firmware and that
      # CONFIG_KEYSTONE_DRIVER survived olddefconfig, so a silently-inert build
      # fails here rather than producing an image that boots and proves nothing.
      - name: Build boot image
        run: make -C testcode/keystone

      - name: Record image provenance
        run: |
          cd testcode/keystone/build
          sha256sum boot.lst amoeba.dtb > boot.sha256
          {
            echo "linux:    6.6"
            echo "opensbi:  1.1"
            echo "keystone: 73aeab79b97f4cea3e418897841e5534fc978f4b"
            echo "commit:   ${GITHUB_SHA}"
          } > boot.provenance
          cat boot.sha256 boot.provenance

      - uses: actions/upload-artifact@v4
        with:
          name: amoeba-keystone-boot-image
          path: |
            testcode/keystone/build/boot.lst
            testcode/keystone/build/amoeba.dtb
            testcode/keystone/build/boot.sha256
            testcode/keystone/build/boot.provenance
          retention-days: 30
          compression-level: 9
